document.getElementById('turma').addEventListener('change',carregarNomes);
const bancoQuestoes = [
 {id:'Q01',aula:1,tipo:'multipla',imagem:'imagens_8ano/atmosfera.jpg',enunciado:'Observe a imagem da Terra vista do espaço e considere a região gasosa que envolve o planeta. Qual alternativa descreve melhor uma função ou característica dessa região?',alternativas:['A Astronomia se limita à observação visual de estrelas, sem utilizar instrumentos ou modelos.','A Astronomia investiga astros, movimentos e fenômenos do Universo recorrendo a observações, instrumentos e modelos científicos.','A Astronomia estuda somente os fenômenos atmosféricos que acontecem nas proximidades do solo.','A Astronomia e a Meteorologia são a mesma área, pois ambas analisam exclusivamente imagens de satélite.'],correta:1},
 {id:'Q02',aula:2,tipo:'multipla',enunciado:'Durante uma aula, um grupo compara o movimento aparente do Sol no céu com a alternância entre dia e noite e com a passagem de um ano. Para interpretar corretamente essas observações, é preciso distinguir movimentos da Terra que têm períodos e consequências diferentes. Qual análise é cientificamente consistente?',alternativas:['A rotação da Terra está associada à sucessão de dias e noites, enquanto a translação está relacionada ao movimento orbital ao redor do Sol.','A translação ocorre em torno do próprio eixo terrestre e produz apenas a alternância entre dia e noite.','A rotação da Terra é responsável por completar uma órbita ao redor do Sol a cada ano.','Rotação e translação são nomes diferentes para o mesmo movimento, observado de pontos distintos.'],correta:0},
 {id:'Q03',aula:3,tipo:'multipla',enunciado:'Em uma conversa sobre as estações do ano, um estudante afirma que o verão ocorre quando a Terra está mais próxima do Sol em todo o planeta. Outro lembra que, no mesmo período, os hemisférios podem apresentar estações opostas. Qual explicação avalia melhor essa situação?',alternativas:['As estações dependem apenas da distância entre a Terra e o Sol, que é igual para os dois hemisférios.','A inclinação do eixo terrestre e a translação alteram a incidência de luz nos hemisférios ao longo do ano.','As estações são causadas principalmente pelas fases da Lua e ocorrem simultaneamente da mesma forma em toda a Terra.','O eixo da Terra não interfere na iluminação; apenas a rotação diária produz as estações.'],correta:1},
 {id:'Q04',aula:4,tipo:'multipla',imagem:'imagens_8ano/eclipse_solar.jpg',enunciado:'A fotografia mostra a Lua e o Sol em uma configuração de alinhamento observada a partir da Terra. Para interpretar uma imagem desse tipo, é necessário considerar que a aparência dos astros depende da posição do observador e da luz disponível. Qual afirmação é mais adequada?',alternativas:['A Lua emite luz visível própria com intensidade semelhante à do Sol.','A Lua é um planeta que produz energia luminosa por reações em sua superfície.','A Lua é um satélite natural e sua face iluminada pode ser observada porque reflete a luz solar.','A Lua só pode ser vista quando a atmosfera terrestre produz luz ao seu redor.'],correta:2},
 {id:'Q05',aula:6,tipo:'multipla',enunciado:'Ao longo de um mês, um observador registra diferentes formas aparentes da Lua. Ele percebe que a superfície lunar não está mudando de formato, embora a porção clara visível varie. Qual modelo explica melhor esse registro?',alternativas:['As fases resultam da combinação entre a iluminação do Sol e as posições relativas do Sol, da Terra e da Lua.','As fases ocorrem porque a sombra da Terra cobre a Lua todas as noites, sempre com intensidade diferente.','As fases são causadas pela rotação do Sol, que ilumina partes aleatórias da Lua.','A Lua produz mais ou menos luz conforme se aproxima ou se afasta da atmosfera terrestre.'],correta:0},
 {id:'Q06',aula:7,tipo:'multipla',imagem:'imagens_8ano/eclipse_solar.jpg',enunciado:'Eclipses não acontecem em todas as luas nova ou cheia, pois o alinhamento entre os astros precisa ser suficientemente preciso. Ao analisar essa condição, qual alternativa descreve corretamente um eclipse solar?',alternativas:['A Terra se posiciona entre o Sol e a Lua, e a sombra terrestre atinge a Lua.','A Lua se posiciona entre o Sol e a Terra, e sua sombra pode atingir uma região da superfície terrestre.','O Sol se posiciona entre a Terra e a Lua, bloqueando a luz que chega à Terra.','A Lua deixa de refletir luz porque sua face iluminada desaparece durante algumas horas.'],correta:1},
 {id:'Q07',aula:9,tipo:'multipla',imagem:'imagens_8ano/nuvens.jpg',enunciado:'Uma reportagem informa que uma cidade terá chuva e queda de temperatura amanhã. Em outra notícia, o mesmo local é descrito como pertencente a uma região de clima tropical. Embora os termos estejam relacionados, eles não significam a mesma coisa. Qual interpretação está correta?',alternativas:['Tempo atmosférico descreve condições observadas em um momento ou período curto; clima envolve padrões analisados por longos períodos.','Clima é a previsão para as próximas horas, enquanto tempo é a média das condições atmosféricas de décadas.','Tempo e clima são sinônimos; a diferença ocorre apenas na linguagem usada pelos jornalistas.','Clima descreve exclusivamente a temperatura, enquanto tempo descreve somente a ocorrência de chuva.'],correta:0},
 {id:'Q08',aula:10,tipo:'multipla',imagem:'imagens_8ano/estacao_meteorologica.jpg',enunciado:'Uma estação meteorológica reúne instrumentos e séries de dados para apoiar previsões. Um boletim não é elaborado a partir de uma única observação, pois diferentes variáveis se relacionam na evolução das condições atmosféricas. Qual conjunto é mais pertinente para essa análise?',alternativas:['Temperatura, umidade do ar, pressão atmosférica, vento e precipitação.','Apenas a fase da Lua, o tipo de solo e a distância até o litoral.','Somente a altitude de uma cidade, sem medições da atmosfera.','Apenas a quantidade de árvores e o número de habitantes da região.'],correta:0},
 {id:'Q09',aula:17,tipo:'multipla',imagem:'imagens_8ano/el_nino.jpg',enunciado:'Mapas de temperatura da superfície do oceano podem mostrar anomalias distribuídas por grandes áreas. Para interpretar o El Niño e a La Niña, é necessário relacionar o oceano à atmosfera e aos efeitos regionais, sem concluir que todo evento climático tenha uma única causa. Qual alternativa apresenta uma interpretação adequada?',alternativas:['São fenômenos associados a alterações nas temperaturas do Pacífico equatorial que podem modificar padrões atmosféricos e afetar diferentes regiões.','São eclipses periódicos que alteram diretamente a quantidade de luz recebida pela superfície terrestre.','São estações do ano que acontecem ao mesmo tempo em todos os continentes.','São mudanças diárias da pressão atmosférica sem relação com o oceano.'],correta:0},
 {id:'Q10',aula:14,tipo:'dissertativa',imagem:'imagens_8ano/atmosfera.jpg',enunciado:'A circulação atmosférica envolve movimentos de massas de ar e transferência de energia. Analise a imagem e explique como diferenças de aquecimento entre regiões podem contribuir para deslocar ar, vapor de água e calor, relacionando esse processo ao tempo ou ao clima.'},
];

function embaralhar(lista){for(let i=lista.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lista[i],lista[j]]=[lista[j],lista[i]]}return lista}
function renderizar(){const area=document.getElementById('questoes');area.innerHTML='';questoes.forEach((q,i)=>{const div=document.createElement('section');div.className='question';let h=`<span class="badge">Aula ${q.aula}</span><p><strong>Questão ${i+1}</strong> – ${q.tipo==='multipla'?'Múltipla escolha':'Dissertativa'}</p><p>${q.enunciado}</p>`;if(q.imagem)h+=`<img src="${q.imagem}" alt="Imagem real relacionada ao tema da questão" loading="lazy">`;if(q.tipo==='multipla'){h+=`<div class="alternativas">`;q.alternativas.forEach((a,k)=>{h+=`<label><input type="radio" name="q${i}" value="${k}"><span>${String.fromCharCode(65+k)} – ${a}</span></label>`});h+='</div>'}else h+=`<div class="dissertativa"><textarea id="d${i}" placeholder="Escreva sua resposta..."></textarea></div>`;div.innerHTML=h;area.appendChild(div)})}
function enviarRespostas(){const turma=document.getElementById('turma').value,nome=document.getElementById('nome').value.trim(),ra=document.getElementById('ra').value,email=document.getElementById('email').value;if(!turma||!nome){alert('Informe a turma e o nome antes de enviar.');return}const respostas=questoes.map((q,i)=>{if(q.tipo==='multipla'){const r=document.querySelector(`input[name="q${i}"]:checked`);return r?r.value:''}return document.getElementById(`d${i}`).value.trim()});const payload={escola:'E.E. PROFª WANDA MASCAGNI DE SÁ',turma,nome,ra,email,respostas,questaoIds:questoes.map(q=>q.id),timestamp:new Date().toISOString()};const btn=document.getElementById('enviar'),fb=document.getElementById('feedback');btn.disabled=true;fb.textContent='Enviando respostas...';fb.className='feedback visivel carregando';fetch('https://script.google.com/macros/s/AKfycbwWOKtQeNgT9jMZyhNhsj8NB2Vicf1yct5mC1s_1U-9YMQlGO3Om7s_Nzmd0/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(r=>r.text()).then(t=>{let d;try{d=JSON.parse(t)}catch(e){throw new Error('Resposta inválida do Apps Script')}if(!d.success)throw new Error(d.error||'Erro ao registrar respostas');fb.textContent='Respostas registradas com sucesso! Nota objetiva: '+d.notaObjetivas;fb.className='feedback visivel sucesso';btn.textContent='Respostas enviadas'}).catch(e=>{fb.textContent='Erro ao enviar: '+e.message;fb.className='feedback visivel erro';btn.disabled=false})}
renderizar();
</script>
</body>
</html>
